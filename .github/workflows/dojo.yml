name: Code to Cloud Security Dojo validation

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dojo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run source:check
      - run: npm run check:public
      - run: npm run plan
      - name: Compile infrastructure and lint shell entrypoints
        run: |
          set -euo pipefail
          for template in infra/foundation.bicep infra/main.bicep infra/security-reader.bicep; do
            az bicep build --file "$template" --stdout > /dev/null
          done
          bash -n scripts/deploy.sh
          bash -n scripts/manage.sh
          shellcheck scripts/deploy.sh scripts/manage.sh
      - name: Browser checks
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Scan source, dependencies, IaC and container recipes
        uses: microsoft/security-devops-action@08976cb623803b1b36d7112d4ff9f59eae704de0 # v1.12.0
        id: msdo
      - name: Retain pipeline scan evidence
        if: always() && steps.msdo.outputs.sarifFile != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipeline-sarif
          path: ${{ steps.msdo.outputs.sarifFile }}
      - name: Build isolated scan images without Azure credentials
        run: |
          set -euo pipefail
          npm run image:build -- --tag dojo:scan
          docker build -f apps/control-portal/Dockerfile -t dojo-portal:scan .
      - name: Record intentional Dojo workload vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: dojo:scan
          format: sarif
          output: dojo-scan.sarif
          exit-code: "0"
      - name: Gate portal high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: dojo-portal:scan
          format: sarif
          output: portal-scan.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Retain image and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-and-browser-evidence
          path: |
            *-scan.sarif
            output/browser/
            apps/dojo/source-lock.json
            output/images/**/local-image.json
