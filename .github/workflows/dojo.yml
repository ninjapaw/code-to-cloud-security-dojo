name: Code to Cloud Security Dojo validation

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      drowsy-dragon:
        description: Build and scan Drowsy Dragon (protected environment credentials required)
        type: boolean
        default: false
      nginx-proxy:
        description: Build and scan both original NGINX Proxy modes (no Azure deployment)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dojo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nginx-proxy:
    if: github.event_name != 'workflow_dispatch' || inputs.nginx-proxy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [vulnerable, remediated]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1 # v0.2.4
        with:
          version: v0.74.0
      - name: Build and scan the selected NGINX mode
        env:
          NGINX_MODE: ${{ matrix.mode }}
        run: npm run image:build:nginx -- --mode "$NGINX_MODE"
      - name: Export the NGINX image and its Dockerfile
        env:
          NGINX_MODE: ${{ matrix.mode }}
        run: |
          node scripts/export-image-artifact.mjs \
            --image "nginx-proxy:$NGINX_MODE" \
            --dockerfile apps/nginx-proxy/upstream/Dockerfile \
            --output "output/container-images/nginx-proxy-$NGINX_MODE"
      - name: Upload the NGINX container image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nginx-proxy-${{ matrix.mode }}-container
          path: output/container-images/nginx-proxy-${{ matrix.mode }}/
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
      - name: Retain NGINX source, package and scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nginx-proxy-${{ matrix.mode }}-evidence
          path: |
            output/images/nginx-proxy/
            apps/nginx-proxy/source-lock.json

  drowsy-dragon:
    if: github.ref == 'refs/heads/dev' && github.event_name == 'workflow_dispatch' && inputs.drowsy-dragon
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: drowsy-dragon-images
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1 # v0.2.4
        with:
          version: v0.74.0
      - name: Check access to the pinned DHI source image
        id: dhi-login
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$DHI_USERNAME" || -n "$DHI_TOKEN" ]]; then
            : "${DHI_USERNAME:?Set both DHI credentials in the drowsy-dragon-images environment}"
            : "${DHI_TOKEN:?Set both DHI credentials in the drowsy-dragon-images environment}"
            printf '%s' "$DHI_TOKEN" | docker login dhi.io --username "$DHI_USERNAME" --password-stdin
            echo "authenticated=true" >> "$GITHUB_OUTPUT"
          else
            echo "No DHI credentials configured; checking public access to the pinned image."
          fi
          base_image="$(node --input-type=module -e 'import { drowsyDragon } from "./shared/drowsy-dragon.mjs"; console.log(drowsyDragon.baseImage)')"
          docker pull --platform linux/amd64 "$base_image"
      - name: Build and record package and vulnerability evidence
        run: npm run image:build:dragon -- --tag drowsy-dragon:scan
      - name: Export Drowsy Dragon and its Dockerfile
        run: |
          node scripts/export-image-artifact.mjs \
            --image drowsy-dragon:scan \
            --dockerfile apps/drowsy-dragon/Dockerfile \
            --output output/container-images/drowsy-dragon
      - name: Upload the Drowsy Dragon container image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drowsy-dragon-container
          path: output/container-images/drowsy-dragon/
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
      - name: Retain Drowsy Dragon evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drowsy-dragon-evidence
          path: output/images/drowsy-dragon/
      - name: Sign out of the source registry
        if: always() && steps.dhi-login.outputs.authenticated == 'true'
        run: docker logout dhi.io

  validate-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run source:check
      - run: npm run image:check:nginx
      - run: npm run check:public
      - run: npm run plan
      - name: Compile infrastructure and lint shell entrypoints
        run: |
          set -euo pipefail
          for template in infra/foundation.bicep infra/main.bicep; do
            az bicep build --file "$template" --stdout > /dev/null
          done
          bash -n scripts/deploy.sh
          bash -n scripts/manage.sh
          shellcheck scripts/deploy.sh scripts/manage.sh
      - name: Browser checks
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Scan source, dependencies, IaC and container recipes
        uses: microsoft/security-devops-action@08976cb623803b1b36d7112d4ff9f59eae704de0 # v1.12.0
        id: msdo
      - name: Retain pipeline scan evidence
        if: always() && steps.msdo.outputs.sarifFile != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipeline-sarif
          path: ${{ steps.msdo.outputs.sarifFile }}
      - name: Build isolated scan images without Azure credentials
        run: |
          set -euo pipefail
          npm run image:build -- --tag dojo:scan
          docker build -f apps/control-portal/Dockerfile -t dojo-portal:scan .
      - name: Verify Dojo root routing
        run: |
          set -euo pipefail
          container="dojo-root-routing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --detach --name "$container" --publish 127.0.0.1::8080 dojo:scan > /dev/null
          trap 'docker rm --force "$container" > /dev/null 2>&1 || true' EXIT
          endpoint="$(docker port "$container" 8080/tcp)"
          port="${endpoint##*:}"
          for _attempt in $(seq 1 90); do
            if curl --silent --show-error --fail --max-time 2 \
              "http://127.0.0.1:${port}/WebGoat/actuator/health" > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl --silent --show-error --fail --max-time 5 \
            "http://127.0.0.1:${port}/WebGoat/actuator/health" > /dev/null
          headers="$(
            curl --silent --show-error --dump-header - --output /dev/null \
              --max-redirs 0 --max-time 5 "http://127.0.0.1:${port}/"
          )"
          grep -Eq '^HTTP/[0-9.]+ 302([[:space:]]|$)' <<< "$headers"
          grep -Eiq '^location: /WebGoat/[[:space:]]*$' <<< "$headers"
      - uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1 # v0.2.4
        with:
          version: v0.74.0
      - name: Record intentional Dojo workload vulnerabilities
        run: trivy image --format sarif --output dojo-scan.sarif --exit-code 0 dojo:scan
      - name: Gate portal high and critical vulnerabilities
        run: trivy image --format sarif --output portal-scan.sarif --severity HIGH,CRITICAL --exit-code 1 dojo-portal:scan
      - name: Export WebGoat and portal images with their Dockerfiles
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { exportImageArtifact } from "./scripts/export-image-artifact.mjs";
          const source = JSON.parse(await readFile("apps/dojo/source-lock.json", "utf8"));
          await exportImageArtifact("dojo:scan", `output/images/${source.revision}/Dojo.Dockerfile`, "output/container-images/dojo");
          await exportImageArtifact("dojo-portal:scan", "apps/control-portal/Dockerfile", "output/container-images/control-portal");
          NODE
      - name: Upload WebGoat and portal container images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webgoat-and-portal-containers
          path: output/container-images/
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
      - name: Retain image and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-and-browser-evidence
          path: |
            *-scan.sarif
            output/browser/
            apps/dojo/source-lock.json
            output/images/**/local-image.json
