name: Code to Cloud Security Dojo validation

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      drowsy-dragon:
        description: Build and scan Drowsy Dragon (protected environment credentials required)
        type: boolean
        default: false
      nginx-proxy:
        description: Build and scan both original NGINX Proxy modes (no Azure deployment)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dojo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nginx-proxy:
    if: github.event_name != 'workflow_dispatch' || inputs.nginx-proxy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [vulnerable, remediated]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1 # v0.2.4
        with:
          version: v0.74.0
      - name: Build and scan the selected NGINX mode
        env:
          NGINX_MODE: ${{ matrix.mode }}
        run: npm run image:build:nginx -- --mode "$NGINX_MODE"
      - name: Retain NGINX source, package and scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nginx-proxy-${{ matrix.mode }}-evidence
          path: |
            output/images/nginx-proxy/
            apps/nginx-proxy/source-lock.json

  drowsy-dragon:
    if: github.ref == 'refs/heads/dev' && github.event_name == 'workflow_dispatch' && inputs.drowsy-dragon
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: drowsy-dragon-images
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1 # v0.2.4
        with:
          version: v0.74.0
      - name: Sign in to the DHI source registry
        id: dhi-login
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          set -euo pipefail
          : "${DHI_USERNAME:?Set the DHI_USERNAME repository secret}"
          : "${DHI_TOKEN:?Set the DHI_TOKEN repository secret}"
          printf '%s' "$DHI_TOKEN" | docker login dhi.io --username "$DHI_USERNAME" --password-stdin
      - name: Build and record package and vulnerability evidence
        run: npm run image:build:dragon -- --tag drowsy-dragon:scan
      - name: Retain Drowsy Dragon evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drowsy-dragon-evidence
          path: output/images/drowsy-dragon/
      - name: Sign out of the source registry
        if: always() && steps.dhi-login.outcome == 'success'
        run: docker logout dhi.io

  validate-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run source:check
      - run: npm run image:check:nginx
      - run: npm run check:public
      - run: npm run plan
      - name: Compile infrastructure and lint shell entrypoints
        run: |
          set -euo pipefail
          for template in infra/foundation.bicep infra/main.bicep; do
            az bicep build --file "$template" --stdout > /dev/null
          done
          bash -n scripts/deploy.sh
          bash -n scripts/manage.sh
          shellcheck scripts/deploy.sh scripts/manage.sh
      - name: Browser checks
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Scan source, dependencies, IaC and container recipes
        uses: microsoft/security-devops-action@08976cb623803b1b36d7112d4ff9f59eae704de0 # v1.12.0
        id: msdo
      - name: Retain pipeline scan evidence
        if: always() && steps.msdo.outputs.sarifFile != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipeline-sarif
          path: ${{ steps.msdo.outputs.sarifFile }}
      - name: Build isolated scan images without Azure credentials
        run: |
          set -euo pipefail
          npm run image:build -- --tag dojo:scan
          docker build -f apps/control-portal/Dockerfile -t dojo-portal:scan .
      - uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1 # v0.2.4
        with:
          version: v0.74.0
      - name: Record intentional Dojo workload vulnerabilities
        run: trivy image --format sarif --output dojo-scan.sarif --exit-code 0 dojo:scan
      - name: Gate portal high and critical vulnerabilities
        run: trivy image --format sarif --output portal-scan.sarif --severity HIGH,CRITICAL --exit-code 1 dojo-portal:scan
      - name: Retain image and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-and-browser-evidence
          path: |
            *-scan.sarif
            output/browser/
            apps/dojo/source-lock.json
            output/images/**/local-image.json
