name: Code to Cloud Security Dojo deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Guarded lifecycle operation (build publishes Dockerfile images and artifacts)
        type: choice
        required: true
        options:
          - doctor
          - provision
          - protection
          - build
          - what-if
          - deploy
          - verify
          - report
      confirm-resource-group:
        description: Type the configured resource group exactly
        type: string
        required: true
      accept-costs:
        description: Accept recurring charges (required for provision, protection and optional-image deployments)
        type: boolean
        default: false
      release-run-id:
        description: Build workflow run ID (required for what-if and deploy)
        type: string
        required: false
      release-confirmation:
        description: Exact deploy token emitted by what-if (required for deploy)
        type: string
        required: false

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: dojo-deployment-code-to-cloud-training
  cancel-in-progress: false

jobs:
  lifecycle:
    if: github.ref == 'refs/heads/dev'
    runs-on: ${{ fromJSON(vars.DOJO_DEPLOY_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 90
    environment: code-to-cloud-training
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_PROTECTION_CLIENT_ID: ${{ vars.AZURE_PROTECTION_CLIENT_ID }}
      DOJO_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      DOJO_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      DOJO_RESOURCE_GROUP: ${{ vars.DOJO_RESOURCE_GROUP }}
      DOJO_LOCATION: ${{ vars.DOJO_LOCATION }}
      DOJO_OPERATOR_OBJECT_ID: ${{ vars.DOJO_OPERATOR_OBJECT_ID }}
      DOJO_ADMIN_CIDR: ${{ vars.DOJO_ADMIN_CIDR }}
      DOJO_DROWSY_DRAGON_ENABLED: ${{ vars.DOJO_DROWSY_DRAGON_ENABLED }}
      DOJO_NGINX_PROXY_ENABLED: ${{ vars.DOJO_NGINX_PROXY_ENABLED }}
      DOJO_NGINX_PROXY_MODE: ${{ vars.DOJO_NGINX_PROXY_MODE }}
      DOJO_EVIDENCE_PUBLIC_ACCESS: ${{ vars.DOJO_EVIDENCE_PUBLIC_ACCESS }}
      DOJO_VIA_PORTAL: ${{ vars.DOJO_VIA_PORTAL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1 # v0.2.4
        with:
          version: v0.74.0
      - name: Validate target approval and create private configuration
        id: configuration
        env:
          CONFIRM_RESOURCE_GROUP: ${{ inputs.confirm-resource-group }}
          OPERATION: ${{ inputs.operation }}
          ACCEPT_COSTS: ${{ inputs.accept-costs }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID DOJO_TENANT_ID DOJO_SUBSCRIPTION_ID DOJO_RESOURCE_GROUP DOJO_LOCATION DOJO_OPERATOR_OBJECT_ID DOJO_ADMIN_CIDR; do
            test -n "${!name:-}" || { echo "Missing GitHub environment variable: $name" >&2; exit 1; }
          done
          if [[ "$OPERATION" == "protection" ]]; then
            test -n "$AZURE_PROTECTION_CLIENT_ID" || {
              echo "Missing GitHub environment variable: AZURE_PROTECTION_CLIENT_ID" >&2
              exit 1
            }
          fi
          test "$CONFIRM_RESOURCE_GROUP" = "$DOJO_RESOURCE_GROUP" || {
            echo "Resource-group confirmation does not match the protected environment." >&2
            exit 1
          }
          if [[ "$OPERATION" == "provision" || "$OPERATION" == "protection" ]]; then
            test "$ACCEPT_COSTS" = "true" || {
              echo "This operation requires explicit recurring-cost consent." >&2
              exit 1
            }
          fi
          config_path="$RUNNER_TEMP/dojo-deploy.json"
          echo "DOJO_CONFIG=$config_path" >> "$GITHUB_ENV"
          node scripts/workflow-config.mjs "$config_path"
          DOJO_CONFIG="$config_path" node scripts/deploy.mjs plan > /dev/null
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from "node:fs/promises";
          const config = JSON.parse(await readFile(process.env.RUNNER_TEMP + "/dojo-deploy.json", "utf8"));
          console.log(`drowsy-dragon=${config.drowsyDragonEnabled === true}`);
          NODE
      - name: Test Dockerfile build and release guardrails
        if: inputs.operation == 'build'
        run: |
          npm test
          npm run source:check
          npm run image:check:nginx
          npm run check:public
      - name: Check access to the pinned DHI source image
        if: inputs.operation == 'build' && steps.configuration.outputs.drowsy-dragon == 'true'
        id: dhi-login
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$DHI_USERNAME" || -n "$DHI_TOKEN" ]]; then
            : "${DHI_USERNAME:?Set both DHI credentials in the code-to-cloud-training environment}"
            : "${DHI_TOKEN:?Set both DHI credentials in the code-to-cloud-training environment}"
          else
            : "${DOCKER_USERNAME:?Set DOCKER_USERNAME and DOCKER_TOKEN organization secrets and grant this repository access}"
            : "${DOCKER_TOKEN:?Set DOCKER_USERNAME and DOCKER_TOKEN organization secrets and grant this repository access}"
            DHI_USERNAME="$DOCKER_USERNAME"
            DHI_TOKEN="$DOCKER_TOKEN"
          fi
          printf '%s' "$DHI_TOKEN" | docker login dhi.io --username "$DHI_USERNAME" --password-stdin
          echo "authenticated=true" >> "$GITHUB_OUTPUT"
          base_image="$(node --input-type=module -e 'import { drowsyDragon } from "./shared/drowsy-dragon.mjs"; console.log(drowsyDragon.baseImage)')"
          docker pull --platform linux/amd64 "$base_image"
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ inputs.operation == 'protection' && env.AZURE_PROTECTION_CLIENT_ID || env.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify reviewed build run provenance
        if: inputs.operation == 'what-if' || inputs.operation == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release-run-id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "release-run-id must be numeric" >&2; exit 1; }
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")"
          jq -e \
            --arg sha "$GITHUB_SHA" \
            '.event == "workflow_dispatch"
              and .path == ".github/workflows/deploy.yml"
              and .head_branch == "dev"
              and .head_sha == $sha
              and .conclusion == "success"' \
            <<< "$run_json" > /dev/null || {
              echo "Release artifact must come from a successful build operation on this exact dev commit." >&2
              exit 1
            }
      - name: Download reviewed release evidence
        if: inputs.operation == 'what-if' || inputs.operation == 'deploy'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dojo-release-${{ inputs.release-run-id }}
          path: output/code-to-cloud-training
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release-run-id }}
      - name: Verify release artifact provenance
        if: inputs.operation == 'what-if' || inputs.operation == 'deploy'
        env:
          RELEASE_RUN_ID: ${{ inputs.release-run-id }}
        run: |
          set -euo pipefail
          jq -e \
            --arg runId "$RELEASE_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            '.runId == $runId
              and .repository == $repository
              and .workflow == ".github/workflows/deploy.yml"
              and .ref == "refs/heads/dev"
              and .sha == $sha
              and .operation == "build"' \
            output/code-to-cloud-training/workflow-provenance.json > /dev/null || {
              echo "Release artifact provenance does not match this reviewed deployment." >&2
              exit 1
            }
      - name: Execute guarded lifecycle operation
        env:
          OPERATION: ${{ inputs.operation }}
          ACCEPT_COSTS: ${{ inputs.accept-costs }}
          RELEASE_RUN_ID: ${{ inputs.release-run-id }}
          RELEASE_CONFIRMATION: ${{ inputs.release-confirmation }}
        run: |
          set -euo pipefail
          portal_args=()
          case "${DOJO_VIA_PORTAL:-false}" in
            true) portal_args+=(--via-portal) ;;
            false) ;;
            *) echo "DOJO_VIA_PORTAL must be true or false" >&2; exit 1 ;;
          esac
          if [[ "$DOJO_VIA_PORTAL" == "true" && ( "$OPERATION" == "deploy" || "$OPERATION" == "verify" || "$OPERATION" == "report" ) ]]; then
            portal_url="$(node --input-type=module -e 'import { loadConfig, names } from "./shared/config.mjs"; console.log("https://" + names(await loadConfig()).portal + ".azurewebsites.net/health")')"
            curl --silent --show-error --fail --max-time 30 "$portal_url" > /dev/null || {
              echo "The runner cannot reach the protected portal. Configure repository variable DOJO_DEPLOY_RUNNER_LABELS for an authorized Linux runner; do not widen ingress." >&2
              exit 1
            }
          fi
          case "$OPERATION" in
            doctor)
              node scripts/deploy.mjs "$OPERATION"
              ;;
            verify|report)
              node scripts/deploy.mjs "$OPERATION" "${portal_args[@]}"
              ;;
            provision|protection)
              node scripts/deploy.mjs "$OPERATION" \
                --confirm "$OPERATION:$DOJO_SUBSCRIPTION_ID:$DOJO_RESOURCE_GROUP" \
                --accept-costs
              ;;
            build)
              node scripts/deploy.mjs build \
                --confirm "build:$DOJO_SUBSCRIPTION_ID:$DOJO_RESOURCE_GROUP"
              ;;
            what-if)
              [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "release-run-id must be numeric" >&2; exit 1; }
              node scripts/deploy.mjs what-if \
                --release output/code-to-cloud-training/release.json
              ;;
            deploy)
              [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "release-run-id must be numeric" >&2; exit 1; }
              test -n "$RELEASE_CONFIRMATION" || { echo "release-confirmation is required" >&2; exit 1; }
              deploy_args=( \
                --release output/code-to-cloud-training/release.json \
                --confirm "$RELEASE_CONFIRMATION" \
              )
              if [[ "$ACCEPT_COSTS" == "true" ]]; then deploy_args+=(--accept-costs); fi
              deploy_args+=("${portal_args[@]}")
              node scripts/deploy.mjs deploy "${deploy_args[@]}"
              ;;
          esac
      - name: Export the scanned release images and Dockerfiles
        if: success() && inputs.operation == 'build'
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { exportImageArtifact } from "./scripts/export-image-artifact.mjs";
          const release = JSON.parse(await readFile("output/code-to-cloud-training/release.json", "utf8"));
          const recipes = {
            dojo: "output/code-to-cloud-training/Dojo.Dockerfile",
            portal: "apps/control-portal/Dockerfile",
            drowsyDragon: "apps/drowsy-dragon/Dockerfile",
            nginxProxy: "apps/nginx-proxy/upstream/Dockerfile",
          };
          for (const [key, entry] of Object.entries(release.images)) {
            await exportImageArtifact(entry.image, recipes[key], `output/container-images/${entry.repository}`, {
              expectedImageId: entry.imageId,
            });
          }
          NODE
      - name: Upload the app-named container images
        if: success() && inputs.operation == 'build'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dojo-container-images-${{ github.run_id }}
          path: output/container-images/
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
      - name: Record build workflow provenance
        if: success() && inputs.operation == 'build'
        run: |
          set -euo pipefail
          jq -n \
            --arg runId "$GITHUB_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow ".github/workflows/deploy.yml" \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg operation "build" \
            '{runId: $runId, repository: $repository, workflow: $workflow, ref: $ref, sha: $sha, operation: $operation}' \
            > output/code-to-cloud-training/workflow-provenance.json
      - name: Retain immutable release and review evidence
        if: always() && (inputs.operation == 'build' || inputs.operation == 'what-if' || inputs.operation == 'deploy' || inputs.operation == 'verify' || inputs.operation == 'report')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dojo-release-${{ github.run_id }}
          path: output/code-to-cloud-training/
          if-no-files-found: error
          retention-days: 90
      - name: Retain live deployment status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dojo-deployment-status-${{ github.run_id }}
          path: |
            output/code-to-cloud-training/deployment-status.json
            output/code-to-cloud-training/deployment-status.html
          if-no-files-found: ignore
          retention-days: 90
      - name: Sign out of the source registry
        if: always() && steps.dhi-login.outputs.authenticated == 'true'
        run: docker logout dhi.io
